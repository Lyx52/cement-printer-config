[include mainsail.cfg]
[printer]
kinematics: cartesian
max_velocity: 60
max_accel: 300
max_z_velocity: 20
max_z_accel: 60
square_corner_velocity: 3.0

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32f446xx_330058001651303432383339-if00

[virtual_sdcard]
path: /home/dietpi/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

[gcode_arcs]
resolution: 5.0

[force_move]
enable_force_move: True

[stepper_y]
step_pin: PF13
dir_pin: PF12
enable_pin: !PF14
microsteps: 64
rotation_distance: 38
endstop_pin: !PG6
position_endstop: 0
position_max: 7100
homing_speed: 20

[stepper_z]
step_pin: PG0
dir_pin: !PG1
enable_pin: !PF15
microsteps: 64
rotation_distance: 8
endstop_pin: !PG9
position_endstop: 823
position_max: 823
homing_speed: 20
homing_positive_dir: true

[stepper_x]
step_pin: PG4
dir_pin: PC1
enable_pin: !PG5
microsteps: 64
rotation_distance: 38
endstop_pin: !PG12
position_endstop: 0
position_max: 7500
homing_speed: 25

[stepper_x1]
step_pin: PF11
dir_pin: PG3
enable_pin: !PG5
microsteps: 64
rotation_distance: 38
endstop_pin: !PG13

[extruder]
step_pin: PF9
dir_pin: !PF10
microsteps: 100
max_extrude_only_velocity: 60
max_extrude_only_accel: 100
rotation_distance: 162
nozzle_diameter: 30.0
filament_diameter: 30.0
max_extrude_only_distance: 999999
max_extrude_cross_section: 15000
pressure_advance: 0.1
smooth_time: 0.05

# --- THE COLD EXTRUSION BYPASS ---
min_temp: -273.15
min_extrude_temp: -273.15
max_temp: 999
heater_pin: PA2
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PF4
control: watermark
